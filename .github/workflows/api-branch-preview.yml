name: api.karasu256.com Branch Preview

on:
  push:
    branches-ignore:
      - main
      - dev

concurrency:
  group: api-branch-preview-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BRANCH: ${{ github.ref_name }}
  WORKER_NAME: api-karasu256-com-branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.worker_url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve preview alias
        id: preview
        run: node .github/scripts/api-preview-alias.mjs "$BRANCH" "$WORKER_NAME"

      - name: Resolve Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node .github/scripts/neon-preview-branch.mjs "preview/$BRANCH" main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build worker
        run: pnpm --filter api.karasu256.com build:branch

      - name: Upload preview version
        working-directory: apps/api.karasu256.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: node ../../.github/scripts/api-upload-preview.mjs "$WORKER_NAME" "${{ steps.preview.outputs.alias }}" "$BRANCH"

      - name: Resolve preview URL
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/api-worker-url.mjs "$WORKER_NAME" "${{ steps.preview.outputs.alias }}"

  sync-vercel:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Point Vercel branch previews at the worker
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_IDS: ${{ vars.VERCEL_PROJECT_ID_ACCOUNTS }},${{ vars.VERCEL_PROJECT_ID_KARASU256 }}
        run: node .github/scripts/sync-vercel-branch-api-url.mjs "$BRANCH" "${{ needs.deploy.outputs.url }}"

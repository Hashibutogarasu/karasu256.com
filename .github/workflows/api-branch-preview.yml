name: api.karasu256.com Branch Preview

on:
  push:
    branches-ignore:
      - main
      - dev
  deployment_status:

concurrency:
  group: api-branch-preview-${{ github.event_name == 'deployment_status' && github.event.deployment.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Preview') &&
       contains(github.event.deployment.environment, 'accounts.karasu256.com') &&
       github.event.deployment.ref != 'main' &&
       github.event.deployment.ref != 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.event_name == 'deployment_status' && github.event.deployment.ref || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve accounts preview URL
        id: accounts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_ACCOUNTS: ${{ vars.VERCEL_PROJECT_ID_ACCOUNTS }}
        run: node .github/scripts/accounts-branch-url.mjs "$BRANCH"

      - name: Resolve worker name
        if: steps.accounts.outputs.found == 'true'
        id: worker
        run: node .github/scripts/api-worker-name.mjs "$BRANCH"

      - name: Resolve Neon branch
        if: steps.accounts.outputs.found == 'true'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/${{ env.BRANCH }}
          parent_branch: main

      - name: Set up pnpm
        if: steps.accounts.outputs.found == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.accounts.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build worker
        if: steps.accounts.outputs.found == 'true'
        run: pnpm --filter api.karasu256.com build:branch

      - name: Deploy worker
        if: steps.accounts.outputs.found == 'true'
        working-directory: apps/api.karasu256.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --name "${{ steps.worker.outputs.name }}" --var "ACCOUNTS_URL:${{ steps.accounts.outputs.url }}"

      - name: Set worker secrets
        if: steps.accounts.outputs.found == 'true'
        working-directory: apps/api.karasu256.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: node ../../.github/scripts/api-worker-secrets.mjs "${{ steps.worker.outputs.name }}"

      - name: Resolve worker URL
        if: steps.accounts.outputs.found == 'true'
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/api-worker-url.mjs "${{ steps.worker.outputs.name }}"

      - name: Point Vercel branch previews at the worker
        if: steps.accounts.outputs.found == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_IDS: ${{ vars.VERCEL_PROJECT_ID_ACCOUNTS }},${{ vars.VERCEL_PROJECT_ID_KARASU256 }}
        run: node .github/scripts/sync-vercel-branch-api-url.mjs "$BRANCH" "${{ steps.worker_url.outputs.url }}"

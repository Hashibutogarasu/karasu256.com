name: api.karasu256.com Branch Cleanup

on:
  delete:

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve worker name
        id: worker
        run: node .github/scripts/api-worker-name.mjs "${{ github.event.ref }}"

      - name: Delete worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --name "${{ steps.worker.outputs.name }}" --force

      - name: Remove the branch API_URL from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_IDS: ${{ vars.VERCEL_PROJECT_ID_ACCOUNTS }},${{ vars.VERCEL_PROJECT_ID_KARASU256 }}
        run: node .github/scripts/remove-vercel-branch-api-url.mjs "${{ github.event.ref }}"

name = "karasulab-cron-jobs"
main = "src/index.ts"
compatibility_date = "2025-06-24"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
